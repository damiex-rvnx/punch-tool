name: Deploy Cloudflare Worker

on:
  push:
    branches: [claude/crew-clock-app-SDfGg, main]
    paths: [cloudflare-worker.js, wrangler.toml]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Deploy Worker
    steps:
      - uses: actions/checkout@v4

      - name: Install Wrangler
        run: npm install -g wrangler

      - name: Deploy Worker script
        run: wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 770447eb9a0fc2475bd1d61eeb6d2021

      - name: Upload ONESIGNAL_REST_KEY secret
        run: echo "$ONESIGNAL_REST_KEY" | wrangler secret put ONESIGNAL_REST_KEY
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 770447eb9a0fc2475bd1d61eeb6d2021
          ONESIGNAL_REST_KEY: ${{ secrets.ONESIGNAL_REST_KEY }}
