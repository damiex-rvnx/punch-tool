name: Deploy Cloudflare Worker

on:
  push:
    branches: [claude/crew-clock-app-SDfGg, main]
    paths:
      - cloudflare-worker.js
      - wrangler.toml
      - .github/workflows/deploy-worker.yml
  workflow_dispatch:

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: 770447eb9a0fc2475bd1d61eeb6d2021

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Wrangler
        run: npm install -g wrangler@latest

      - name: Provision KV namespace (create if missing, reuse if exists)
        run: |
          ACCOUNT_ID="770447eb9a0fc2475bd1d61eeb6d2021"
          CREATE=$(curl -s -X POST "https://api.cloudflare.com/client/v4/accounts/$ACCOUNT_ID/storage/kv/namespaces" -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H "Content-Type: application/json" --data '{"title":"QR_SCHEDULE"}')
          KV_ID=$(echo "$CREATE" | jq -r '.result.id // empty')
          if [ -z "$KV_ID" ]; then
            LIST=$(curl -s "https://api.cloudflare.com/client/v4/accounts/$ACCOUNT_ID/storage/kv/namespaces?per_page=100" -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN")
            KV_ID=$(echo "$LIST" | jq -r '.result[] | select(.title=="QR_SCHEDULE") | .id' | head -n 1)
          fi
          if [ -z "$KV_ID" ]; then
            echo "ERROR: failed to get KV namespace ID"
            echo "CREATE response: $CREATE"
            exit 1
          fi
          echo "Using KV_ID=$KV_ID"
          sed -i "s/KV_NAMESPACE_ID_PLACEHOLDER/$KV_ID/" wrangler.toml
          cat wrangler.toml

      - name: Deploy Worker
        run: wrangler deploy

      - name: Upload VAPID private key secret
        run: printf '%s' "$VAPID_PRIVATE_KEY" | wrangler secret put VAPID_PRIVATE_KEY
        env:
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
