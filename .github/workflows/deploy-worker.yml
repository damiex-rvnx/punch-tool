name: Deploy Cloudflare Worker

on:
  push:
    branches: [claude/crew-clock-app-SDfGg, main]
    paths:
      - cloudflare-worker.js
      - wrangler.toml
      - .github/workflows/deploy-worker.yml
  workflow_dispatch:

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: 770447eb9a0fc2475bd1d61eeb6d2021

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Wrangler
        run: npm install -g wrangler@latest

      - name: Sanity-check secrets for non-ASCII chars
        run: |
          python3 -c "
          import os
          for name in ['CLOUDFLARE_API_TOKEN', 'CLOUDFLARE_ACCOUNT_ID']:
              v = os.environ.get(name, '')
              bad = [(i, ord(c)) for i, c in enumerate(v) if ord(c) > 127]
              print(f'{name}: len={len(v)}, non_ascii_count={len(bad)}, bad_positions={bad[:5]}')
          "

      - name: Deploy Worker
        run: wrangler deploy

      - name: Upload VAPID private key secret
        run: printf '%s' "$VAPID_PRIVATE_KEY" | wrangler secret put VAPID_PRIVATE_KEY
        env:
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
